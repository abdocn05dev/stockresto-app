<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_vendre">Vendre un plat - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <div class="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" class="active" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_vendre">Vendre un plat</h2>
    <form id="form-vente">
      <label for="plat-select" data-i18n="label_plat">Plat</label>
      <select id="plat-select" required>
        <option value="" data-i18n="chargement_plats">Chargement des plats...</option>
      </select>
      <button type="submit" id="btn-vendre" data-i18n="bouton_vendre">Vendre</button>
    </form>

    <div id="resultat"></div>
  </main>

  <script type="module" src="vendre-ui.js"></script>
</body>
</html>
