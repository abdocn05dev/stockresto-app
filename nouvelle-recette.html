<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_nouvelle_recette">Nouvelle recette - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="header-right">☰</button>
    <div class="header-right" id="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" class="active" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
        <a href="historique.html" data-i18n="nav_historique">Historique</a>
        <a href="nouveau-fournisseur.html" data-i18n="nav_fournisseurs">Fournisseurs</a>
        <a href="statistiques.html" data-i18n="nav_statistiques">Statistiques</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_nouvelle_recette">Associer un ingrédient à un plat</h2>
    <form id="form-recette">
      <label for="plat" data-i18n="label_plat">Plat</label>
      <select id="plat" required>
        <option value="" data-i18n="chargement_plats">Chargement des plats...</option>
      </select>

      <label for="ingredient" data-i18n="label_ingredient">Ingrédient</label>
      <select id="ingredient" required>
        <option value="" data-i18n="chargement_ingredients">Chargement des ingrédients...</option>
      </select>

      <label for="quantite" data-i18n="label_quantite">Quantité</label>
      <input type="number" id="quantite" step="0.01" min="0" required>

      <label for="unite" data-i18n="label_unite">Unité</label>
      <select id="unite" required></select>

      <button type="submit" id="btn-ajouter" data-i18n="bouton_ajouter_recette">Ajouter à la recette</button>
    </form>

    <div id="resultat"></div>

    <h2 data-i18n="titre_recettes_existantes">Recettes existantes</h2>
    <table>
      <thead>
        <tr>
          <th data-i18n="label_plat">Plat</th>
          <th data-i18n="colonne_ingredients">Ingrédients</th>
          <th data-i18n="colonne_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="recettes-body">
        <tr><td colspan="3" data-i18n="chargement">Chargement...</td></tr>
      </tbody>
    </table>
  </main>

  <div id="modale-edition-recette" class="modale-overlay" hidden>
    <div class="modale modale-large" role="dialog" aria-modal="true" aria-labelledby="modale-edition-recette-titre">
      <h3 id="modale-edition-recette-titre" data-i18n="titre_modifier_recette">Modifier la recette</h3>
      <p>
        <span data-i18n="label_plat">Plat</span> :
        <strong id="edition-recette-plat-nom"></strong>
      </p>
      <form id="form-modale-edition-recette">
        <div id="edition-recette-lignes"></div>
        <button type="button" id="btn-edition-recette-ajouter-ligne" class="bouton-secondaire" data-i18n="bouton_ajouter_ligne">+ Ajouter un ingrédient</button>

        <div id="modale-edition-recette-resultat"></div>

        <div class="modale-actions">
          <button type="button" id="btn-edition-recette-annuler" class="bouton-secondaire" data-i18n="bouton_annuler">Annuler</button>
          <button type="submit" id="btn-edition-recette-enregistrer" data-i18n="bouton_enregistrer">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modale-suppression-recette" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-suppression-recette-titre">
      <h3 id="modale-suppression-recette-titre" data-i18n="titre_supprimer_recette">Supprimer la recette</h3>
      <div id="modale-suppression-recette-contenu"></div>
      <div class="modale-actions" id="modale-suppression-recette-actions"></div>
    </div>
  </div>

  <script type="module" src="nouvelle-recette.js"></script>
</body>
</html>
