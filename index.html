<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_stock">Stock des ingrédients - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <div class="header-right">
      <nav>
        <a href="index.html" class="active" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
        <a href="historique.html" data-i18n="nav_historique">Historique</a>
        <a href="nouveau-fournisseur.html" data-i18n="nav_fournisseurs">Fournisseurs</a>
        <a href="statistiques.html" data-i18n="nav_statistiques">Statistiques</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_stock">Ingrédients en stock</h2>
    <p id="message"></p>
    <table>
      <thead>
        <tr>
          <th data-i18n="colonne_ingredient">Ingrédient</th>
          <th data-i18n="colonne_stock_actuel">Stock actuel</th>
          <th data-i18n="colonne_seuil_minimum">Seuil minimum</th>
          <th data-i18n="colonne_statut">Statut</th>
          <th data-i18n="colonne_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="stock-body">
        <tr><td colspan="5" data-i18n="chargement">Chargement...</td></tr>
      </tbody>
    </table>
  </main>

  <div id="modale-mouvement" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
      <h3 id="modale-titre" data-i18n="titre_ajouter_stock">Ajouter du stock</h3>
      <p>
        <span data-i18n="label_ingredient">Ingrédient</span> :
        <strong id="modale-ingredient-nom"></strong>
      </p>
      <form id="form-modale-mouvement">
        <label for="modale-quantite" data-i18n="label_quantite">Quantité</label>
        <input type="number" id="modale-quantite" step="0.01" min="0.01" required>

        <div id="modale-resultat"></div>

        <div class="modale-actions">
          <button type="button" id="btn-modale-annuler" class="bouton-secondaire" data-i18n="bouton_annuler">Annuler</button>
          <button type="submit" id="btn-modale-confirmer" data-i18n="bouton_confirmer">Confirmer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modale-edition" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-edition-titre">
      <h3 id="modale-edition-titre" data-i18n="titre_modifier_ingredient">Modifier l'ingrédient</h3>
      <form id="form-modale-edition">
        <label for="edition-nom" data-i18n="label_nom">Nom</label>
        <input type="text" id="edition-nom" required>

        <label for="edition-unite" data-i18n="label_unite">Unité</label>
        <select id="edition-unite" required>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
          <option value="unite" data-i18n="unite_piece">unité</option>
        </select>

        <label for="edition-seuil" data-i18n="colonne_seuil_minimum">Seuil minimum</label>
        <input type="number" id="edition-seuil" step="0.01" min="0" required>

        <div id="modale-edition-resultat"></div>

        <div class="modale-actions">
          <button type="button" id="btn-edition-annuler" class="bouton-secondaire" data-i18n="bouton_annuler">Annuler</button>
          <button type="submit" id="btn-edition-enregistrer" data-i18n="bouton_enregistrer">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modale-suppression" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-suppression-titre">
      <h3 id="modale-suppression-titre" data-i18n="titre_supprimer_ingredient">Supprimer l'ingrédient</h3>
      <div id="modale-suppression-contenu"></div>
      <div class="modale-actions" id="modale-suppression-actions"></div>
    </div>
  </div>

  <script type="module" src="stock.js"></script>
</body>
</html>
