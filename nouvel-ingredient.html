<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_nouvel_ingredient">Nouvel ingrédient - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <div class="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" class="active" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
        <a href="historique.html" data-i18n="nav_historique">Historique</a>
        <a href="nouveau-fournisseur.html" data-i18n="nav_fournisseurs">Fournisseurs</a>
        <a href="statistiques.html" data-i18n="nav_statistiques">Statistiques</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_nouvel_ingredient">Ajouter un ingrédient</h2>
    <form id="form-ingredient">
      <label for="nom" data-i18n="label_nom">Nom</label>
      <input type="text" id="nom" required>

      <label for="unite" data-i18n="label_unite">Unité</label>
      <select id="unite" required>
        <option value="kg">kg</option>
        <option value="g">g</option>
        <option value="L">L</option>
        <option value="ml">ml</option>
        <option value="unite" data-i18n="unite_piece">unité</option>
      </select>

      <label for="prix_achat" data-i18n="label_prix_achat">Prix d'achat (DH)</label>
      <input type="number" id="prix_achat" step="0.01" min="0" required>

      <label for="stock_actuel" data-i18n="colonne_stock_actuel">Stock actuel</label>
      <input type="number" id="stock_actuel" step="0.01" min="0" required>

      <label for="seuil_minimum" data-i18n="colonne_seuil_minimum">Seuil minimum</label>
      <input type="number" id="seuil_minimum" step="0.01" min="0" required>

      <button type="submit" id="btn-ajouter" data-i18n="bouton_ajouter_ingredient">Ajouter l'ingrédient</button>
    </form>

    <div id="resultat"></div>
  </main>

  <script type="module" src="nouvel-ingredient.js"></script>
</body>
</html>
