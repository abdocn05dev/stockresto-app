<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_nouveau_plat">Nouveau plat - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <div class="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" class="active" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_nouveau_plat">Ajouter un plat</h2>
    <form id="form-plat">
      <label for="nom" data-i18n="label_nom">Nom</label>
      <input type="text" id="nom" required>

      <label for="categorie" data-i18n="label_categorie">Catégorie</label>
      <select id="categorie" required>
        <option value="" data-i18n="chargement_categories">Chargement des catégories...</option>
      </select>

      <label for="nouvelle-categorie" id="label-nouvelle-categorie" hidden data-i18n="label_nouvelle_categorie">Nouvelle catégorie</label>
      <input type="text" id="nouvelle-categorie" hidden>

      <label for="prix_vente" data-i18n="label_prix_vente">Prix de vente (DH)</label>
      <input type="number" id="prix_vente" step="0.01" min="0" required>

      <button type="submit" id="btn-ajouter" data-i18n="bouton_ajouter_plat">Ajouter le plat</button>
    </form>

    <div id="resultat"></div>

    <h2 data-i18n="titre_plats_existants">Plats existants</h2>
    <table>
      <thead>
        <tr>
          <th data-i18n="label_nom">Nom</th>
          <th data-i18n="label_categorie">Catégorie</th>
          <th data-i18n="label_prix_vente">Prix de vente (DH)</th>
          <th data-i18n="colonne_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="plats-body">
        <tr><td colspan="4" data-i18n="chargement">Chargement...</td></tr>
      </tbody>
    </table>
  </main>

  <div id="modale-edition-plat" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-edition-plat-titre">
      <h3 id="modale-edition-plat-titre" data-i18n="titre_modifier_plat">Modifier le plat</h3>
      <form id="form-modale-edition-plat">
        <label for="edition-plat-nom" data-i18n="label_nom">Nom</label>
        <input type="text" id="edition-plat-nom" required>

        <label for="edition-plat-categorie" data-i18n="label_categorie">Catégorie</label>
        <select id="edition-plat-categorie" required></select>

        <label for="edition-plat-nouvelle-categorie" id="label-edition-plat-nouvelle-categorie" hidden data-i18n="label_nouvelle_categorie">Nouvelle catégorie</label>
        <input type="text" id="edition-plat-nouvelle-categorie" hidden>

        <label for="edition-plat-prix" data-i18n="label_prix_vente">Prix de vente (DH)</label>
        <input type="number" id="edition-plat-prix" step="0.01" min="0" required>

        <div id="modale-edition-plat-resultat"></div>

        <div class="modale-actions">
          <button type="button" id="btn-edition-plat-annuler" class="bouton-secondaire" data-i18n="bouton_annuler">Annuler</button>
          <button type="submit" id="btn-edition-plat-enregistrer" data-i18n="bouton_enregistrer">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modale-suppression-plat" class="modale-overlay" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-suppression-plat-titre">
      <h3 id="modale-suppression-plat-titre" data-i18n="titre_supprimer_plat">Supprimer le plat</h3>
      <div id="modale-suppression-plat-contenu"></div>
      <div class="modale-actions" id="modale-suppression-plat-actions"></div>
    </div>
  </div>

  <script type="module" src="nouveau-plat.js"></script>
</body>
</html>
