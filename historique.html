<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_historique">Historique - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="header-right">☰</button>
    <div class="header-right" id="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
        <a href="historique.html" class="active" data-i18n="nav_historique">Historique</a>
        <a href="nouveau-fournisseur.html" data-i18n="nav_fournisseurs">Fournisseurs</a>
        <a href="statistiques.html" data-i18n="nav_statistiques">Statistiques</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_historique">Historique des mouvements</h2>
    <p id="message"></p>
    <table>
      <thead>
        <tr>
          <th data-i18n="colonne_date">Date/Heure</th>
          <th data-i18n="colonne_ingredient">Ingrédient</th>
          <th data-i18n="label_quantite">Quantité</th>
          <th data-i18n="colonne_motif">Motif</th>
        </tr>
      </thead>
      <tbody id="historique-body">
        <tr><td colspan="4" data-i18n="chargement">Chargement...</td></tr>
      </tbody>
    </table>

    <button type="button" id="btn-charger-plus" class="bouton-secondaire" data-i18n="bouton_charger_plus" hidden>Charger plus</button>
  </main>

  <script type="module" src="historique.js"></script>
</body>
</html>
