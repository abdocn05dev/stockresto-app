<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titre_page_modifier_stock">Modifier le stock - StockResto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_titre">StockResto</h1>
    <div class="header-right">
      <nav>
        <a href="index.html" data-i18n="nav_stock">Stock</a>
        <a href="vendre.html" data-i18n="nav_vendre">Vendre un plat</a>
        <a href="modifier-stock.html" class="active" data-i18n="nav_modifier_stock">Modifier le stock</a>
        <a href="nouvel-ingredient.html" data-i18n="nav_nouvel_ingredient">Nouvel ingrédient</a>
        <a href="nouveau-plat.html" data-i18n="nav_nouveau_plat">Nouveau plat</a>
        <a href="nouvelle-recette.html" data-i18n="nav_nouvelle_recette">Nouvelle recette</a>
      </nav>
      <select id="langue-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <main>
    <h2 data-i18n="titre_modifier_stock">Modifier le stock</h2>
    <form id="form-modifier-stock">
      <label for="ingredient" data-i18n="label_ingredient">Ingrédient</label>
      <select id="ingredient" required>
        <option value="" data-i18n="chargement_ingredients">Chargement des ingrédients...</option>
      </select>

      <label for="motif" data-i18n="label_type_mouvement">Type de mouvement</label>
      <select id="motif" required>
        <option value="reapprovisionnement" data-i18n="motif_reapprovisionnement">Réapprovisionnement (+)</option>
        <option value="correction_ajout" data-i18n="motif_correction_ajout">Correction (ajouter)</option>
        <option value="correction_retrait" data-i18n="motif_correction_retrait">Correction (retirer)</option>
        <option value="perte" data-i18n="motif_perte">Perte/Casse (-)</option>
      </select>

      <label for="quantite" data-i18n="label_quantite">Quantité</label>
      <input type="number" id="quantite" step="0.01" min="0.01" required>

      <button type="submit" id="btn-valider" data-i18n="bouton_valider">Valider</button>
    </form>

    <div id="resultat"></div>
  </main>

  <script type="module" src="modifier-stock.js"></script>
</body>
</html>
